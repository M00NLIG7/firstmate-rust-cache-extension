name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-test:
    runs-on: ubuntu-24.04
    container:
      image: rust:1.86.0-slim-bookworm@sha256:a044f7ab9a762f95be2ee7eb2c49e4d4a4ec60011210de9f7da01d552cae3a55
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Git
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes git
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install alternate Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.86.0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Behavioral tests
        run: npm test
  macos-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install reviewed Rust toolchains
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.86.0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Behavioral tests
        run: npm run test:platform-fallback
